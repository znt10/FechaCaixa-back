# Compose de PRODUCAO (Coolify / VPS). O docker-compose.yml ao lado e o de
# desenvolvimento: gunicorn com --reload, codigo por bind mount e portas
# abertas no host.
#
# No Coolify, no recurso do tipo "Docker Compose":
#   Docker Compose Location = /docker-compose.prod.yml
#   Dominio no servico "api", porta 8000
#
# So api e db. Nao ha worker, beat nem Redis: o beat agendava
# "enviar_digest_lojas", que saiu junto com o estoque na migration 0036 e nao
# existe mais, e o worker so tinha esse agendamento e um e-mail para entregar.
# O e-mail agora sai na propria requisicao (CELERY_TASK_ALWAYS_EAGER).
# As variaveis com ${...} sao definidas na aba Environment Variables; o resto e
# fixo porque so faz sentido dentro desta rede. Nenhum servico publica porta:
# quem expoe a API e o proxy do Coolify.
#
# Sem YAML anchors de proposito: o Coolify reescreve este arquivo antes de
# subir, entao cada servico repete o proprio environment.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-fechacaixa}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Pelo TCP, e nao pelo socket: na primeira subida o MySQL levanta um
      # servidor temporario para criar o banco, e esse temporario JA responde
      # no socket. Com "-h localhost" o compose dava o banco por pronto uns
      # segundos antes de ele aceitar conexao de verdade, e a api ia bater em
      # porta fechada. Medido: socket responde aos 7s, TCP so aos 10s.
      #
      # A senha vai na linha de comando porque ela ja esta no ambiente deste
      # container (MYSQL_ROOT_PASSWORD), entao nao ha segredo novo exposto aqui
      # — e $$ escapado depende de como o Coolify reescreve o arquivo, o que
      # nao e coisa para descobrir em producao.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Criar o banco do zero passa dos 100s que as tentativas davam antes,
      # quando o servidor esta ocupado — logo depois de um build, por exemplo.
      # Dentro do start_period a falha nao gasta tentativa, e o primeiro
      # sucesso encerra a espera na hora.
      start_period: 180s

  api:
    build: .
    restart: unless-stopped
    # O entrypoint.sh roda collectstatic, migrate, garantir_grupos e
    # ensure_admin antes do gunicorn. Timeout de 120s por causa dos PDFs
    # (WeasyPrint) e do upload de notas em lote.
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /healthz/ so responde 200 quando o banco responde. O script manda o
      # Host do ALLOWED_HOSTS: sem isso o Django recusa a chamada com 400 e o
      # container fica "unhealthy" com a aplicacao funcionando.
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DEBUG: "False"
      # Precisa conter o dominio publico da API, "api" (o nome pelo qual o
      # front chama o Django dentro da rede) e 127.0.0.1 (o healthcheck).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?defina CSRF_TRUSTED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-fechacaixa}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      # Sem worker: o unico .delay() vivo e o e-mail de "esqueci a senha", e
      # com isto ele roda dentro da propria requisicao, sem broker nenhum.
      CELERY_TASK_ALWAYS_EAGER: "True"
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?defina DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?defina DJANGO_SUPERUSER_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FechaCaixa <no-reply@fechacaixa.local>}

volumes:
  mysql_data:
