# Compose de PRODUCAO (Coolify / VPS). O docker-compose.yml ao lado e o de
# desenvolvimento: gunicorn com --reload, codigo por bind mount e portas
# abertas no host.
#
# No Coolify, no recurso do tipo "Docker Compose":
#   Docker Compose Location = /docker-compose.prod.yml
#   Dominio no servico "api", porta 8000
# As variaveis com ${...} sao definidas na aba Environment Variables; o resto e
# fixo porque so faz sentido dentro desta rede. Nenhum servico publica porta:
# quem expoe a API e o proxy do Coolify.
#
# Sem YAML anchors de proposito: o Coolify reescreve este arquivo antes de
# subir, entao cada servico repete o proprio environment.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-fechacaixa}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    # O entrypoint.sh roda collectstatic, migrate, garantir_grupos e
    # ensure_admin antes do gunicorn. Timeout de 120s por causa dos PDFs
    # (WeasyPrint) e do upload de notas em lote.
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # /healthz/ so responde 200 quando o banco responde. Feito com o proprio
      # Python porque a imagem e a python:3.12-slim, que nao traz curl nem
      # wget. O Host e 127.0.0.1, entao ele precisa estar no ALLOWED_HOSTS —
      # senao o Django responde 400 e o container fica "unhealthy" de pe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DEBUG: "False"
      # Precisa conter o dominio publico da API, "api" (o nome pelo qual o
      # front chama o Django dentro da rede) e 127.0.0.1 (o healthcheck).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?defina ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?defina CSRF_TRUSTED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-fechacaixa}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?defina DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?defina DJANGO_SUPERUSER_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FechaCaixa <no-reply@fechacaixa.local>}

  worker:
    build: .
    restart: unless-stopped
    # Entrypoint proprio (lista nao vazia): pula o entrypoint.sh, para as
    # migracoes rodarem so na api. "entrypoint: []" quebra no Coolify.
    entrypoint: ["celery", "-A", "backend", "worker", "-l", "info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-fechacaixa}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FechaCaixa <no-reply@fechacaixa.local>}

  beat:
    build: .
    restart: unless-stopped
    entrypoint: ["celery", "-A", "backend", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ${DB_NAME:-fechacaixa}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  mysql_data:
  redis_data:
