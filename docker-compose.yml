# Nome do projeto fixo. Sem isto o Compose deriva do nome da pasta, e clonado
# como submodulo ela se chama "backend" — a rede viraria backend_default, e o
# front, que entra em fechacaixa_back_default, nao acharia a API.
name: fechacaixa_back

services:
  db:
    image: mysql:8.0
    container_name: fechacaixa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: fechacaixa
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fechacaixa_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  api:
    build: .
    container_name: fechacaixa_api
    restart: on-failure
    # So no compose, que e o ambiente local: o CMD do Dockerfile (o que roda em
    # producao) continua sem --reload. Sem isto o gunicorn segura o codigo que
    # subiu com o container, e toda mudanca no back so aparece depois de um
    # `docker restart` manual — o que ja custou dois "nao funciona" que eram, na
    # verdade, o servidor servindo o arquivo de antes.
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      # "api" precisa estar na lista porque e por esse nome que o front
      # chama o Django dentro da rede do compose: com DEBUG=False o Django
      # rejeita com 400 (ALLOWED_HOSTS) qualquer Host que nao esteja aqui.
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,api

  worker:
    build: .
    container_name: fechacaixa_worker
    restart: on-failure
    entrypoint: []
    command: celery -A backend worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0

  beat:
    build: .
    container_name: fechacaixa_beat
    restart: on-failure
    entrypoint: []
    command: celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0

volumes:
  mysql_data:
